<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>پنل مدیریت فروشگاه</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<link rel="stylesheet" href="css/store.css">
<style>
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs button{min-height:42px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.tabs button.on{background:var(--gold);color:var(--goldink);border-color:var(--gold)}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.tbl th{color:var(--muted);font-weight:600;font-size:.9rem}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover{background:var(--bg2)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.imgs{display:flex;gap:10px;flex-wrap:wrap}
.imgs figure{margin:0;width:110px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#111}
.imgs img{width:110px;height:84px;object-fit:cover}
.imgs figcaption{display:flex;gap:4px;padding:4px}
.imgs button{flex:1;font-size:.8rem;min-height:30px;border-radius:6px;border:1px solid var(--line);background:var(--bg2);cursor:pointer}
.spr{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-bottom:8px}
.ok-msg{color:var(--green)}
</style>
</head>
<body>
<header class="top"><div class="wrap"><span class="brand"><i aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="10" r="6"/><path d="M12 16v6"/></svg></i>پنل مدیریت</span>
<div class="top-actions" style="margin-inline-start:auto"><a class="btn btn-sm" href="index.html">مشاهده‌ی فروشگاه</a><button class="btn btn-sm" id="logout" type="button" hidden>خروج</button></div></div></header>
<main class="wrap" id="root"><div class="loading">در حال بارگذاری…</div></main>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
